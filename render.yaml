services:
  # =========================================================================
  # Gym App Backend Service (FastAPI + Uvicorn)
  # =========================================================================
  - type: web
    name: gym-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_DATABASE
        value: gym_management
      - key: MONGODB_URI
        sync: false # Enter your MongoDB Atlas connection string in Render Dashboard
      - key: FRONTEND_ORIGIN
        value: "https://sinan-gym.vercel.app"
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 32-character secret
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: ADMIN_USERNAME
        value: "coach"
      - key: ADMIN_PASSWORD
        value: "Coach@Gym2026!"
      - key: CLOUDINARY_CLOUD_NAME
        value: "dqoxbzl98"
      - key: CLOUDINARY_API_KEY
        value: "941326782766181"
      - key: CLOUDINARY_API_SECRET
        sync: false # Enter your Cloudinary API secret in the Render Dashboard

